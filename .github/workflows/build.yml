name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || true

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 输出写到文件，失败时再 cat，避免日志截断
      - name: Build release APK
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > /tmp/build.log 2>&1
          RC=$?
          echo "gradle exit=$RC"
          # 只打印错误相关行 + 最后 100 行
          grep -E "^e: |^w: .*error|error: |FAILURE:|What went wrong|Caused by:" /tmp/build.log | head -60
          echo "===== TAIL ====="
          tail -60 /tmp/build.log
          exit $RC

      - name: Rename APK
        if: success()
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/FarDriver-Android-OK.apk
          ls -la output/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FarDriver-Android-OK
          path: output/*.apk
          retention-days: 30
